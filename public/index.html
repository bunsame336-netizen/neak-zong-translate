<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>នាគហ្សង បកប្រែ - Neak Zong Translate AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #07080d;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(168, 85, 247, 0.2);
            border-top-color: #a855f7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        h2 { color: #c084fc; font-size: 22px; font-weight: 800; margin-bottom: 8px; }
        p { color: #94a3b8; font-size: 14px; max-width: 280px; line-height: 1.5; }
        .btn-retry {
            margin-top: 18px;
            padding: 10px 22px;
            background: linear-gradient(135deg, #a855f7, #06b6d4);
            border: none;
            color: #ffffff;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            display: none;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <h2>នាគហ្សង បកប្រែ AI</h2>
    <p id="status-txt">កំពុងភ្ជាប់ទៅកាន់ Cloud Studio 24/7...</p>
    <button class="btn-retry" id="btn-retry" onclick="reconnect()">ព្យាយាមភ្ជាប់ឡើងវិញ</button>
    <script>
        function reconnect() {
            window.location.replace("https://neak-zong-translate.onrender.com");
        }
        setTimeout(reconnect, 500);
        setTimeout(function() {
            var btn = document.getElementById('btn-retry');
            var txt = document.getElementById('status-txt');
            if (btn && txt) {
                txt.innerText = 'ប្រសិនបើ Server កំពុងចាប់ផ្តើម សូមរង់ចាំបន្តិច ឬចុចភ្ជាប់ឡើងវិញ';
                btn.style.display = 'inline-block';
            }
        }, 5000);
    </script>
</body>
</html>
